extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.3.0"

[source]
paths = ["src", "tests"]
includes = ["vendor"]
# 1.x entities, parsed by the entity:upgrade tests but never loaded.
excludes = ["tests/Fixture"]

[formatter]
# Keep `(new Foo())->bar()`: CI formats under each job's PHP version, and the
# unparenthesised form PHP 8.4+ allows does not parse on 8.3, the minimum.
parentheses-around-new-in-member-access = true

[linter.rules]
# The shared base excludes "test/"; this repository keeps its suites under "tests/".
# Exception classes are message catalogues with one named constructor per failure,
# following php-db's own exclusion of its exception directories.
too-many-methods = { exclude = ["tests/", "src/Exception/"] }

[analyzer]
excludes = ["tests"]
# Nette's InvalidStateException only signals misuse of the code builder API.
unchecked-exceptions = ["Nette\\InvalidStateException"]
